; ==============================================================================
; CẤU HÌNH PLATFORMIO CHO ESP32-C3 VỚI CỔNG TYPE-C TÍCH HỢP (NATIVE USB CDC)
; ==============================================================================

[platformio]
src_dir = main

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf

; Tốc độ Baud cho Serial Monitor
monitor_speed = 115200

; Bộ lọc hiển thị log màu và giải mã địa chỉ lỗi (Crash/Panic) nếu có
monitor_filters = direct, esp32_exception_decoder

; Cấu hình đưa toàn bộ log (ESP_LOG, printf) xuất thẳng qua cổng cáp Type-C
build_flags = 
    -DCONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=1
