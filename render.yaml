services:
  - type: web
    name: esp32-water-monitor
    runtime: python
    rootDir: wifiesp32/data_logger
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT service:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MQTT_BROKER
        value: broker.hivemq.com
      - key: MQTT_PORT
        value: 1883
      - key: MQTT_TOPIC
        value: my_iot_project/stm32_sensor_data
      - key: TIMEOUT_MINUTES
        value: 2.0
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
